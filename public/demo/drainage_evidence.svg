<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="concrete" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#64748b"/>
      <circle cx="3" cy="3" r="1" fill="#475569" opacity="0.5"/>
      <circle cx="10" cy="11" r="1.5" fill="#94a3b8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Concrete Curb & Sidewalk Top -->
  <rect width="800" height="200" fill="url(#concrete)"/>
  <rect x="0" y="190" width="800" height="30" fill="#475569"/>

  <!-- Asphalt Road Below Curb -->
  <rect x="0" y="220" width="800" height="280" fill="#1e293b"/>

  <!-- Steel Catch Basin Grate Frame -->
  <rect x="180" y="170" width="440" height="160" fill="#090d16" rx="8" stroke="#334155" stroke-width="6"/>

  <!-- Steel Grate Bars -->
  <rect x="210" y="180" width="16" height="140" fill="#334155"/>
  <rect x="250" y="180" width="16" height="140" fill="#334155"/>
  <rect x="290" y="180" width="16" height="140" fill="#334155"/>
  <rect x="330" y="180" width="16" height="140" fill="#334155"/>
  <rect x="370" y="180" width="16" height="140" fill="#334155"/>
  <rect x="410" y="180" width="16" height="140" fill="#334155"/>
  <rect x="450" y="180" width="16" height="140" fill="#334155"/>
  <rect x="490" y="180" width="16" height="140" fill="#334155"/>
  <rect x="530" y="180" width="16" height="140" fill="#334155"/>
  <rect x="570" y="180" width="16" height="140" fill="#334155"/>

  <!-- Standing Flooded Water Pool covering grate & road -->
  <ellipse cx="400" cy="270" rx="360" ry="110" fill="url(#water)"/>

  <!-- Accumulated Leaves, Mud & Debris clogging grate bars -->
  <path d="M 220 200 Q 280 180 340 230 Q 380 260 450 210 Q 520 190 580 240 Q 520 290 420 280 Q 320 300 240 250 Z" fill="#78350f" opacity="0.95"/>
  
  <!-- Fallen Leaves shapes -->
  <path d="M 260 210 C 280 190 310 210 300 230 C 280 240 260 230 260 210 Z" fill="#b45309"/>
  <path d="M 340 240 C 370 220 400 240 380 270 C 350 280 330 260 340 240 Z" fill="#d97706"/>
  <path d="M 440 220 C 470 200 490 230 470 250 C 440 260 430 240 440 220 Z" fill="#92400e"/>
  <path d="M 500 250 C 530 230 550 260 520 280 C 490 280 480 260 500 250 Z" fill="#b45309"/>

  <!-- Water Ripples -->
  <ellipse cx="320" cy="270" rx="40" ry="12" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.6"/>
  <ellipse cx="480" cy="290" rx="55" ry="15" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.5"/>

  <!-- Evidence Tag HUD overlay -->
  <rect x="20" y="440" width="380" height="40" rx="6" fill="#020617" opacity="0.85" stroke="#0284c7" stroke-width="1"/>
  <text x="35" y="465" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">
    EVIDENCE #03 • CLOGGED STORM DRAIN (FLOODED)
  </text>
</svg>
