<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="concrete" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#64748b"/>
      <circle cx="3" cy="3" r="1" fill="#475569" opacity="0.5"/>
      <circle cx="10" cy="11" r="1.5" fill="#94a3b8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Concrete Curb & Sidewalk Top -->
  <rect width="800" height="200" fill="url(#concrete)"/>
  <rect x="0" y="190" width="800" height="30" fill="#475569"/>

  <!-- Clean Dry Asphalt Road Below Curb -->
  <rect x="0" y="220" width="800" height="280" fill="#1e293b"/>

  <!-- Steel Catch Basin Grate Frame -->
  <rect x="180" y="170" width="440" height="160" fill="#020617" rx="8" stroke="#64748b" stroke-width="6"/>

  <!-- Clean Steel Grate Bars -->
  <rect x="210" y="180" width="16" height="140" fill="#475569"/>
  <rect x="250" y="180" width="16" height="140" fill="#475569"/>
  <rect x="290" y="180" width="16" height="140" fill="#475569"/>
  <rect x="330" y="180" width="16" height="140" fill="#475569"/>
  <rect x="370" y="180" width="16" height="140" fill="#475569"/>
  <rect x="410" y="180" width="16" height="140" fill="#475569"/>
  <rect x="450" y="180" width="16" height="140" fill="#475569"/>
  <rect x="490" y="180" width="16" height="140" fill="#475569"/>
  <rect x="530" y="180" width="16" height="140" fill="#475569"/>
  <rect x="570" y="180" width="16" height="140" fill="#475569"/>

  <!-- Flowing Stream of Clear Water entering grate unobstructed -->
  <path d="M 320 220 Q 350 250 370 320 M 420 220 Q 440 260 460 320" stroke="#38bdf8" stroke-width="6" fill="none" opacity="0.8"/>

  <!-- Evidence Tag HUD overlay -->
  <rect x="20" y="440" width="370" height="40" rx="6" fill="#020617" opacity="0.85" stroke="#10b981" stroke-width="1"/>
  <text x="35" y="465" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">
    PROOF #03 • CLEANED UNOBSTRUCTED STORM DRAIN
  </text>
</svg>
