<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="potholeDepth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <pattern id="asphalt" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1e293b"/>
      <circle cx="3" cy="5" r="1.5" fill="#334155" opacity="0.6"/>
      <circle cx="12" cy="14" r="1.2" fill="#475569" opacity="0.5"/>
      <circle cx="17" cy="4" r="1" fill="#0f172a" opacity="0.8"/>
      <circle cx="8" cy="17" r="1.8" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Road Base -->
  <rect width="800" height="500" fill="url(#asphalt)"/>

  <!-- Curb Edge -->
  <rect x="0" y="0" width="800" height="40" fill="#475569"/>
  <rect x="0" y="36" width="800" height="8" fill="#334155"/>

  <!-- Yellow Lane Marking -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#eab308" stroke-width="12" stroke-dasharray="80 40"/>

  <!-- Crosswalk Line -->
  <rect x="50" y="50" width="40" height="400" fill="#94a3b8" opacity="0.25"/>

  <!-- Pothole Cavity -->
  <path d="M 260 220 C 310 180, 480 190, 540 230 C 600 270, 570 340, 500 370 C 430 400, 310 380, 250 330 C 200 280, 220 250, 260 220 Z" fill="url(#potholeDepth)" stroke="#020617" stroke-width="8"/>

  <!-- Internal Cracks and Rough Gravel inside Pothole -->
  <path d="M 280 240 Q 350 280 460 260" stroke="#020617" stroke-width="3" fill="none"/>
  <path d="M 320 310 Q 420 350 490 310" stroke="#020617" stroke-width="3" fill="none"/>
  <circle cx="340" cy="270" r="12" fill="#0f172a"/>
  <circle cx="440" cy="310" r="16" fill="#090d16"/>
  <circle cx="390" cy="240" r="9" fill="#020617"/>

  <!-- Asphalt Crack Network radiate outward -->
  <path d="M 250 220 L 190 180 M 190 180 L 150 190 M 190 180 L 170 140" stroke="#020617" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M 540 230 L 620 200 M 620 200 L 670 220 M 620 200 L 640 160" stroke="#020617" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M 500 370 L 560 420 M 560 420 L 610 430" stroke="#020617" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M 250 330 L 180 370 M 180 370 L 130 360" stroke="#020617" stroke-width="2.5" fill="none" opacity="0.9"/>

  <!-- Evidence Tag HUD overlay -->
  <rect x="20" y="440" width="340" height="40" rx="6" fill="#020617" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="35" y="465" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">
    EVIDENCE #01 • POTHOLE DAMAGE (8 IN)
  </text>
</svg>
