<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Dark Night Sky background -->
  <rect width="800" height="500" fill="url(#nightSky)"/>

  <!-- Distant Trees Outline -->
  <path d="M 0 380 Q 50 340 100 380 T 200 380 T 300 370 T 400 390 T 500 370 T 600 380 T 700 370 T 800 390 L 800 500 L 0 500 Z" fill="#020617"/>

  <!-- Sidewalk Ground -->
  <rect x="0" y="420" width="800" height="80" fill="#1e293b"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#334155" stroke-width="4"/>

  <!-- Steel Pole Structure -->
  <rect x="385" y="100" width="30" height="320" fill="#475569"/>
  <rect x="390" y="100" width="8" height="320" fill="#64748b"/>
  
  <!-- Pole Arm Curve -->
  <path d="M 400 120 C 400 70, 480 60, 520 80" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
  <path d="M 400 116 C 400 68, 480 58, 520 78" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Damaged Light Fixture Luminaire -->
  <path d="M 500 75 L 560 90 L 550 115 L 490 100 Z" fill="#334155" stroke="#1e293b" stroke-width="3"/>

  <!-- Broken Glass & Dangling Wires -->
  <path d="M 510 100 L 505 130 M 520 105 L 525 140 M 535 108 L 530 125" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  <polygon points="515,102 525,115 510,120" fill="#cbd5e1" opacity="0.4"/>
  <polygon points="535,105 545,122 530,118" fill="#cbd5e1" opacity="0.3"/>

  <!-- Dark Unlit Warning Indicator icon -->
  <circle cx="525" cy="95" r="30" fill="#ef4444" opacity="0.2"/>
  <circle cx="525" cy="95" r="20" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="520" y="102" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ef4444">!</text>

  <!-- Evidence Tag HUD overlay -->
  <rect x="20" y="440" width="380" height="40" rx="6" fill="#020617" opacity="0.85" stroke="#ef4444" stroke-width="1"/>
  <text x="35" y="465" font-family="monospace" font-size="13" font-weight="bold" fill="#f87171">
    EVIDENCE #02 • BROKEN STREETLIGHT (UNLIT)
  </text>
</svg>
