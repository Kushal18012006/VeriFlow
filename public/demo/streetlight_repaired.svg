<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lightCone" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Night Sky background -->
  <rect width="800" height="500" fill="url(#nightSky)"/>

  <!-- Light Beam Cone radiating from replaced luminaire -->
  <polygon points="525,95 200,500 850,500" fill="url(#lightCone)"/>

  <!-- Distant Trees Outline -->
  <path d="M 0 380 Q 50 340 100 380 T 200 380 T 300 370 T 400 390 T 500 370 T 600 380 T 700 370 T 800 390 L 800 500 L 0 500 Z" fill="#020617"/>

  <!-- Illuminated Sidewalk Ground -->
  <rect x="0" y="420" width="800" height="80" fill="#334155"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#64748b" stroke-width="4"/>

  <!-- Steel Pole Structure -->
  <rect x="385" y="100" width="30" height="320" fill="#475569"/>
  <rect x="390" y="100" width="8" height="320" fill="#94a3b8"/>
  
  <!-- Pole Arm Curve -->
  <path d="M 400 120 C 400 70, 480 60, 520 80" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
  <path d="M 400 116 C 400 68, 480 58, 520 78" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- New Functional LED Luminaire Fixture -->
  <path d="M 500 75 L 560 90 L 550 110 L 490 95 Z" fill="#1e293b" stroke="#fef08a" stroke-width="2"/>
  <ellipse cx="525" cy="100" rx="20" ry="8" fill="#fef08a"/>
  <circle cx="525" cy="100" r="35" fill="#fef08a" opacity="0.4"/>

  <!-- Evidence Tag HUD overlay -->
  <rect x="20" y="440" width="390" height="40" rx="6" fill="#020617" opacity="0.85" stroke="#10b981" stroke-width="1"/>
  <text x="35" y="465" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">
    PROOF #02 • REPLACED OPERATIONAL LED LUMINAIRE
  </text>
</svg>
